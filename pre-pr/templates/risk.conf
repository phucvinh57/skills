# Risk tiers for scripts/risk.sh. One rule per line: `high <ERE>` or `low <ERE>`, matched against
# repo-relative paths. A path that matches no rule is medium; the highest tier of all changed paths
# wins. `#` starts a comment, so an ERE cannot contain `#`. Keep in step with docs/REVIEW.md.

# High: a human reads the diff. The agent's instructions, the gate itself, CI and release config.
high ^(\.github/|\.claude/|\.agents/|\.githooks/|scripts/)
high ^(AGENTS\.md|CLAUDE\.md|docs/REVIEW\.md)$
high ^(\.config/)?\.?lefthook(-local)?\.(ya?ml|jsonc?|toml)$
# Add the project's sensitive code, e.g. auth, payments, migrations, prompts:
# high ^src/auth/
# high ^migrations/

# Low: prose only.
low ^(README\.md$|docs/)
